# mandrel-platform CI (Story #9).
#
# Self-tests the mandrel-platform repo on every pull request and push to main.
# Runs the branch-protection context lint to validate docs/runbooks/main-protection.json
# and other fast integrity checks appropriate for a config-and-scripts package.
#
# The context lint (`check-required-contexts`) is the canonical self-test for
# the main-protection contract: it asserts every context in requiredStatusChecks
# and every job in upstreamJobs is actually emitted by a workflow in this repo.
#
# The portability lint (`check-workflow-portability`) closes the cross-repo
# blind spot: GitHub validates a reusable workflow's / composite action's
# interface only when a CONSUMER repo calls it, so footguns like relative
# `uses: ./` paths and `${{ }}` expressions in input descriptions/defaults
# ship green here and break every consumer. The lint asserts both invariants
# statically (see the #24 → #29 → #30 → #32 blocker chain that motivated it).
#
# Dogfood (Story #236): the `security` job below self-calls the shared
# pr-quality.yml with every tier except the security tier disabled, so the
# platform's own PRs get the same blocking gitleaks + Semgrep gate it ships to
# every consumer — and the reusable interface gains permanent in-repo execution
# coverage on top of the external smoke repo's. It is a `needs:` of the
# `ci-required` aggregator, so the tier is load-bearing through the repo's
# existing single required context (no branch-protection change needed).
#
# Consumer adoption:
#   Copy scripts/check-required-contexts.mjs and scripts/check-workflow-portability.mjs
#   into your project's scripts/ directory, then add the steps below to your CI:
#
#     - name: Lint branch-protection contract
#       run: node scripts/check-required-contexts.mjs
#     - name: Lint workflow portability
#       run: node scripts/check-workflow-portability.mjs
#
#   See docs/runbooks/branch-protection-setup.md for the full setup guide.
#
# SHA-pinned third-party actions.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node-script checks (contract, portability, pins, unit tests) ──────────
  #
  # One job, one checkout, one Node setup, one step per script. These four
  # checks were previously four separate jobs, each paying ~30-45s of
  # checkout/setup for seconds of actual work — the majority of the
  # workflow's runner minutes on every PR and push (Story #238). Only the
  # `ci-required` aggregator is a required branch-protection context, so
  # per-job granularity bought log grouping, not protection; per-STEP
  # granularity in this job preserves the same at-a-glance failure signal.
  # No path filters: required contexts wedge as "Expected" when path-filtered.
  #
  # The steps, in order:
  #
  # 1. Branch-protection context lint — validates that every context in
  #    docs/runbooks/main-protection.json is actually emitted by a workflow
  #    job in this repo. Exits non-zero on a phantom check. Canonical
  #    self-test for the contract; consumers copy
  #    scripts/check-required-contexts.mjs and run the same step.
  #
  # 2. Cross-repo portability lint — statically asserts the invariants GitHub
  #    only enforces at cross-repo call / action-load time: no relative
  #    `uses: ./` paths in reusable workflows; no `${{ }}` expressions in
  #    workflow_call input/secret descriptions or input defaults (and
  #    composite-action input defaults); and no internal SHA pin lagging onto
  #    a manifest that still carries one of those footguns. These produce a
  #    silent "workflow file issue / 0 jobs" or a "Set up job" load failure
  #    for consumers but pass naive in-repo CI — the exact failure modes of
  #    #30, #32 and #35. Consumers copy scripts/check-workflow-portability.mjs.
  #
  # 3. Third-party action-pin ratchet — walks every workflow and composite
  #    action.yml and FAILS if any third-party `uses:` is pinned to anything
  #    other than a full 40-char commit SHA (a single `owner/repo@v4`
  #    slipping past review re-introduces mutable-tag risk with 3× blast
  #    radius across the consumer fleet, Story #112). First-party
  #    self-references (dsj1984/mandrel-platform/*) are exempt — governed by
  #    the portability lint's pin-lag guard (Rule 3). Algorithm unit-tested
  #    in scripts/check-action-pins.{mjs,test.mjs}; consumers copy the script.
  #
  # 4. Unit tests — the repo's own `npm test` suite
  #    (`node --test "scripts/**/*.test.mjs"`, Story #192): ~2,800 LOC of
  #    guardrail + edge-security tests over the very scripts consumers copy
  #    into their CI. Dependency-free (Node's built-in test runner), so the
  #    job needs only a Node runtime, not a package install.
  #
  # fetch-depth: 0 is REQUIRED so the portability lint's pin-lag guard
  # (Rule 3) can resolve the manifest at each pinned SHA via `git show`.
  # Without full history the guard degrades to a non-fatal skipped NOTE.
  node-scripts:
    name: Node-script checks (contract, portability, pins, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Lint branch-protection contract
        run: node scripts/check-required-contexts.mjs

      - name: Lint workflow portability
        run: node scripts/check-workflow-portability.mjs

      - name: Lint third-party action pins
        run: node scripts/check-action-pins.mjs

      # Catches `gh` CLI flag combinations that pass actionlint/shellcheck but
      # fail the gh CLI at RUNTIME (e.g. --slurp with --jq), which otherwise
      # only surface when the step runs — for the release pipeline, at release
      # time. Regression guard for the 0.25.0 await-smoke wedge.
      - name: Lint gh CLI flag combinations
        run: node scripts/check-workflow-gh-flags.mjs

      # Release-type advisory (Story #368). Merges here are SQUASH, so the
      # pull-request title becomes the commit subject release-please reads —
      # and `ci`/`chore`/`docs`/`test`/`build`/`style` are configured hidden in
      # release-please-config.json, cutting no release and never reaching the
      # CHANGELOG. That is correct for an internal edit and wrong for a change
      # to what this repo PUBLISHES: a consumer-facing workflow input already
      # landed under a `ci:` title, shipped to nobody, and had to be
      # re-released later. Nothing signalled it, because everything was green.
      #
      # ADVISORY BY DESIGN — the step exits 0 whatever it finds and reports via
      # a `::warning::` annotation plus the job summary. Blocking a pull request
      # on a heuristic over a human-written title would be worse than the defect
      # it prevents. It is a STEP in this existing job, so it registers no new
      # status context and needs no branch-protection change.
      #
      # The title arrives through the ENVIRONMENT, never interpolated into the
      # `run:` shell — a pull-request title is attacker-controlled text and
      # `${{ }}` inside a script body is a command-injection seam.
      #
      # Only `pull_request` runs carry a title; a push to `main` supplies an
      # empty PR_TITLE and the check skips.
      - name: Warn on a consumer-facing change under a non-releasing title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-release-type.mjs

      - name: Run unit tests
        run: npm test

  # ── Workflow lint (actionlint + embedded shellcheck) ──────────────────────
  #
  # The reusable workflows ARE the product, yet their YAML was historically
  # validated only by a full cross-repo smoke round-trip — expensive, late
  # feedback. The entire SAST-track shell-bug class (#81/#82/#85/#86/#92)
  # surfaced only at smoke time; actionlint catches that class statically.
  # This job shifts that validation left into the platform's own ci-required
  # (Story #108). It complements — does not replace — the cross-repo smoke gate.
  #
  # actionlint's embedded shellcheck lints every `run:` block, which is what
  # catches the shell-bug class. shellcheck ships preinstalled on the
  # ubuntu-latest image, so no extra install step is needed for it.
  #
  # PIN HYGIENE: actionlint is pinned to a release version and the linux_amd64
  # release archive is verified against its pinned SHA-256 before extraction —
  # the same download-and-verify posture this repo uses for the pinned gitleaks
  # binary in the gitleaks-scan composite action. Bump ACTIONLINT_VERSION and ACTIONLINT_SHA256
  # in lockstep (checksums:
  # https://github.com/rhysd/actionlint/releases/download/v<version>/actionlint_<version>_checksums.txt).
  # The runner kit ships a shell script that runs on the fleet's macOS hosts,
  # where `/bin/bash` is 3.2 — Apple cannot ship a GPL3 bash. Every other job
  # here is ubuntu-latest (bash 5), and the divergences that matter are RUNTIME,
  # not syntax: under `set -u`, bash 3.2 aborts on `"${arr[@]}"` when the array
  # is empty, where 4.4+ expands to nothing. A source-scan denylist cannot see
  # that class, so a regression would pass every ubuntu job and then fail with
  # `unbound variable` on the fleet at the operator's first real invocation.
  #
  # macos-latest still ships the system 3.2, and GitHub-hosted macOS minutes are
  # free for public repositories, so this is the fleet's own interpreter at no
  # cost. Scoped to the runner-kit suite alone — it is the only shipped shell
  # the fleet executes; everything else in `scripts/` is Node.
  runner-kit-bash32:
    name: Runner kit (macOS system bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # Fail loudly rather than silently degrade to a duplicate ubuntu run: if
      # a future image ships a newer /bin/bash, this job would keep passing
      # while proving nothing about the fleet's shell.
      - name: Assert the system bash is still 3.x
        shell: bash
        run: |
          set -euo pipefail
          banner="$(/bin/bash --version | head -1)"
          echo "system bash: ${banner}"
          case "$banner" in
            *"version 3."*) ;;
            *)
              echo "::error::/bin/bash on this image is no longer 3.x (${banner}). This job exists to exercise the fleet's bash 3.2; re-point it at a 3.2 build or retire it deliberately."
              exit 1
              ;;
          esac

      # RUNNER_KIT_BASH pins the suite's interpreter explicitly — without it the
      # suite resolves one itself and would still be correct here, but the pin
      # is what makes this job's intent unambiguous.
      - name: Run the runner-kit suite under bash 3.2
        shell: bash
        env:
          RUNNER_KIT_BASH: /bin/bash
        run: node --test scripts/runner-env-drift.test.mjs

  actionlint:
    name: Lint workflows (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Download + verify a PINNED actionlint binary, then lint every workflow
      # under .github/workflows/. actionlint auto-discovers `.github/workflows/`
      # when invoked with no path args, so pr-quality.yml, deploy-cloudflare.yml,
      # secret-scan-push.yml and the rest are all covered. shellcheck is on
      # PATH (ubuntu-latest), so actionlint runs it on every `run:` block.
      - name: Install pinned actionlint and lint workflows
        shell: bash
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          tmp="$(mktemp -d)"
          echo "Downloading pinned actionlint: ${url}"
          # L8: retry a release-asset blip rather than fail ci-required on a
          # transient registry outage. The SHA-256 check below still gates
          # trust; retries only widen the availability window.
          curl -fsSL --retry 3 --retry-connrefused --max-time 300 "$url" -o "${tmp}/${asset}"
          actual="$(sha256sum "${tmp}/${asset}" | awk '{print $1}')"
          if [ "$actual" != "$ACTIONLINT_SHA256" ]; then
            echo "::error::actionlint checksum mismatch for ${asset}: expected ${ACTIONLINT_SHA256}, got ${actual}"
            exit 1
          fi
          echo "✅ actionlint ${asset} checksum verified."
          tar -xzf "${tmp}/${asset}" -C "${tmp}" actionlint
          chmod +x "${tmp}/actionlint"
          "${tmp}/actionlint" -version
          # No path args → actionlint discovers and lints all .github/workflows/*.
          # -color forces the annotated output even though stdout is not a TTY.
          "${tmp}/actionlint" -color

  # ── Security tier (dogfood self-call of pr-quality.yml, Story #236) ───────
  #
  # The platform ships a blocking PR-time secret scan + SAST to every consumer
  # via pr-quality.yml's security tier, but historically never ran it on
  # itself. This job self-calls the reusable workflow — a same-repo RELATIVE
  # `uses:` ref, which is legitimate in a CALLER (the portability lint's ban
  # targets relative refs INSIDE reusable workflows, where they break
  # cross-repo consumers) and self-updating: each run executes the
  # pr-quality.yml copy on the same commit, so a PR that edits the security
  # tier is gated by its own edit.
  #
  # Tier selection: only the security tier (gitleaks PR-diff secret scan +
  # Semgrep SAST) applies here. The lint/typecheck/unit/contract/e2e tiers
  # assume a pnpm consumer app (this repo is a dependency-free npm scripts
  # package — its lint/tests run in `node-scripts` above), and the OSV tier is
  # disabled because this repo's only runtime dependency surface is already
  # covered by Renovate + the consumer-facing lockfile checks; enabling it
  # here would gate the platform's PRs on advisory timing rather than code.
  #
  # Both scans are DIFF-SCOPED by design (merge-base..head on PRs,
  # event.before..sha on push), so pre-existing findings in history never
  # block; the full-history sweep is the secret-scan.yml signal caller.
  # `.semgrep` is excluded from SAST: it is the vendored ruleset snapshot
  # itself — pattern strings inside it are scan *rules*, not scan *targets*
  # (the built-in `.agents` exclude already drops the vendored framework tree).
  security:
    uses: ./.github/workflows/pr-quality.yml
    with:
      enable-lint: false
      enable-typecheck: false
      enable-unit: false
      enable-contract: false
      enable-e2e: false
      enable-osv-scan: false
      sast-exclude: '.semgrep'
    permissions:
      contents: read
      # pr-quality.yml declares `actions: write` for its opt-in fail-fast
      # cancel step (unused here — fail-fast defaults to false). Granted so
      # the called workflow's declared permissions never exceed the caller's
      # grant.
      actions: write
      # Story #292: pr-quality.yml's migration-guard job declares
      # `pull-requests: read` (unused here — enable-migration-guard is not
      # passed, so it defaults to false and the job's `if:` skips it).
      # GitHub validates a reusable workflow's declared job permissions
      # against the caller's grant at dispatch time regardless of `if:`
      # gating, so omitting this scope here makes the ENTIRE self-call fail
      # with startup_failure before any job runs — not just the unused job.
      pull-requests: read

  # ── Code scanning tier (dogfood self-call of codeql.yml, Story #366) ──────
  #
  # CodeQL ran on this repo's own pull requests long before this job existed,
  # but it was never a REQUIRED status context — and the delivery path arms
  # GitHub native auto-merge, which waits only on required contexts. A pull
  # request introducing a new high-severity alert therefore merged green
  # (two ReDoS regressions reached main exactly that way): landed was not the
  # same as scanned.
  #
  # The fix routes through the AGGREGATOR, not through repository settings.
  # `ci-required` is this repo's one required context, so making the scan a
  # `needs:` of it makes the scan load-bearing without registering a new
  # context. That matters for two reasons:
  #
  #   1. docs/runbooks/main-protection.json lists only the aggregator by
  #      design, and check-required-contexts.mjs matches declared entries
  #      against JOB IDENTIFIERS. Declaring CodeQL's externally-visible check
  #      name ("CodeQL / CodeQL Analysis") would fail that lint, while
  #      declaring the job id would name something that is not registrable as
  #      a context. The aggregator route needs neither.
  #   2. No branch-protection edit is required here, and nothing outside this
  #      repository has to be reconfigured.
  #
  # A CONCLUDED SCAN IS NOT A CLEAN SCAN. `codeql-action/analyze` uploads its
  # SARIF and exits 0 whatever it found, so depending on this job alone would
  # gate on "the scan ran", not on "the scan came back clean" — and the alert
  # signal GitHub does red is a CHECK RUN, which no aggregator can `needs:`.
  # `fail-on-alert-severity: high` makes codeql.yml fail the JOB on an open
  # high/critical alert on the analyzed ref, which is what reaches the
  # aggregator. The input is opt-in and defaults to empty, so passing it here
  # changes nothing for any other caller. `high` matches the severity band the
  # two ReDoS regressions landed at; the query pack and what CodeQL scans are
  # untouched.
  #
  # FAIL TOWARD BLOCKING. The aggregator passes a job that is `success` or
  # `skipped` and fails everything else, INCLUDING `cancelled`. This job
  # therefore carries NO `if:` condition and NO `needs:` — with neither, a
  # GitHub job cannot reach the `skipped` conclusion, so the only ways it can
  # resolve are `success` (green) and failure/cancellation (red). A scan that
  # does not conclude cannot leave the aggregator green.
  # scripts/check-codeql-gating.test.mjs asserts that structurally, because
  # the aggregator's own `run:` block is byte-identical-mirrored with
  # pr-quality.yml and cannot carry a job-specific special case.
  #
  # Scope: repository-local. codeql.yml's `workflow_call` contract is
  # untouched and no reusable workflow a consumer calls gains a CodeQL job —
  # the fleet's private repos (athportal, domio, swarm-os) have code scanning
  # disabled, where a CodeQL job would fail closed on a 403. The vendored
  # Semgrep tier in the `security` job above remains the blocking SAST for
  # them. See docs/reusable-workflows.md § codeql.yml.
  code-scanning:
    uses: ./.github/workflows/codeql.yml
    with:
      fail-on-alert-severity: high
    permissions:
      contents: read
      # codeql.yml's analyze job uploads SARIF as Code Scanning alerts and
      # reads the run's own Actions metadata. A called workflow's declared
      # permissions are validated against the caller's grant at dispatch
      # time, so both scopes must be granted here or the entire call fails
      # with startup_failure before any job runs (the Story #292 lesson from
      # the `security` job above).
      security-events: write
      actions: read

  # ── Aggregator: single required branch-protection context ─────────────────
  #
  # Mirrors the ci-required pattern from pr-quality.yml: a single stable
  # context name that consumers register in branch protection. Passes when
  # all jobs in `needs` succeed or are skipped.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - node-scripts
      - actionlint
      - runner-kit-bash32
      # Dogfood security tier (Story #236): the pr-quality.yml self-call. Its
      # result is the called workflow's overall result, so a gitleaks/Semgrep
      # finding fails this aggregator — the security gate is load-bearing on
      # the platform's own PRs through the existing required context.
      - security
      # Dogfood code-scanning tier (Story #366): the codeql.yml self-call.
      # Listing it here is the ENTIRE gating change — it turns CodeQL from an
      # advisory check nothing waited on into a blocker of the one required
      # context, with no branch-protection edit and no new context.
      - code-scanning
    steps:
      # Self-maintaining aggregator: results are derived from `toJSON(needs)`,
      # so the `needs:` array above is the single source of truth — adding a
      # job to `needs:` is the ONLY edit required to include it in the gate.
      # Pass on `success`/`skipped`; fail on anything else, INCLUDING
      # `cancelled` (load-bearing for the fail-fast design: a tier cancelled
      # by a sibling's failure must not read as green). Requires `jq` on the
      # runner (preinstalled on GitHub-hosted images). Guarded by
      # scripts/check-ci-required-aggregator.test.mjs — do not reintroduce a
      # hardcoded per-job env/loop list here.
      #
      # TRIAGE PARTITION (Story #331): a red aggregate used to print one flat
      # `job(result)` list, so a fail-fast run — where ONE tier failed and the
      # rest were cancelled as collateral — read as N equally-guilty jobs and
      # triage blamed the wrong one. The results are now partitioned into jobs
      # that failed on their own and jobs that were merely `cancelled`, on both
      # the log and the job summary.
      #
      # CANCELLED PROVENANCE (Story #333): a `cancelled` result still said
      # nothing about WHY, so an infra hang, a fail-fast collateral, and a
      # superseded push were indistinguishable at the gate. There is no
      # cancellation-reason field to read (neither `gh run view --json` nor
      # `GET /actions/runs/{id}` exposes one), so provenance is INFERRED from
      # observable run state, in this precedence order:
      #   fail-fast     — some job in the run has conclusion `failure`, which
      #                   explains every cancel in the run. Checked FIRST: a
      #                   queued job cancelled before it started would
      #                   otherwise be misread as an infra hang.
      #   timed-out     — the job ran for its own `timeout-minutes` ceiling and
      #                   GitHub killed it. A CONFIG fault, not infra.
      #   never-started — a cancelled job executed no step (empty `steps[]`, or
      #                   every step `skipped`/null). The infra signature: a
      #                   provisioning hook hung and the job never ran.
      #   superseded    — a newer run exists for the same workflow and branch,
      #                   so this run is not authoritative.
      #   unknown       — the lookup failed, `gh` is absent, or nothing matched.
      #
      # TIMED-OUT (Story #342): a job GitHub killed at its own ceiling used to
      # be reported as `stopped-mid-step` — or, when it was killed before
      # completing a step, misreported as `never-started`. Both readings send
      # triage at the runner fleet, when the fix is to change a number in the
      # workflow. Detection compares each cancelled job's wall duration against
      # its own ceiling, passed in as TIER_TIMEOUT_MINUTES below; the check-run
      # annotations API carrying GitHub's own timeout message is deliberately
      # NOT used, because reading it needs `checks: read` and pr-quality.yml
      # cannot declare a new scope without breaking every consumer at compile
      # time. See the fuller note on the pr-quality.yml side of this mirror.
      #
      # The classification is REPORTED under both policies; `CANCELLED_POLICY`
      # only decides whether a `superseded` run's cancels still red the gate.
      # Neither a `never-started` nor a `timed-out` cancel is ever neutralized:
      # that tier produced no test signal, and passing on a tier that never
      # ran — or was killed before finishing — is the same vacuous pass the
      # all-skipped guard below refuses.
      #
      # This block is mirrored between pr-quality.yml and ci.yml: the `run:`
      # script is byte-identical and both declare the same `env:` keys (the
      # PARITY test). Only how `CANCELLED_POLICY` and `TIER_TIMEOUT_MINUTES`
      # are SOURCED may differ — ci.yml has no workflow_call inputs and has its
      # own tiers — so the script must read them from the environment and never
      # reference `inputs.*` directly.
      - name: Check all required job results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # ci.yml has no workflow_call inputs — source the literal default.
          CANCELLED_POLICY: strict
          # This repo's own base budgets. ci.yml has no workflow_call inputs,
          # so there is no caller override map to union in. The `security` tier
          # is a pr-quality.yml self-call whose inner jobs run under THAT
          # workflow's ceilings and are classified by its own aggregator; they
          # are not listed here.
          #
          # Note the match is by duration, not by job, so it cannot be scoped to
          # this repo's own jobs: a nested pr-quality job ending at 5 or 10
          # minutes would also be labelled `timed-out`. That is bounded and
          # benign in both directions — a nested job killed at a ceiling this
          # list omits (15/20/45) simply keeps its previous label, and every
          # class here is red either way, so the only thing at stake is which
          # word the summary prints.
          TIER_TIMEOUT_BASES: '[5, 10]'
          TIER_TIMEOUT_OVERRIDES: '{}'
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          policy="${CANCELLED_POLICY:-strict}"

          failed="$(jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | map("\(.key)(\(.value.result))")
            | join(" ")
          ' <<<"${NEEDS_JSON}")"

          # Jobs that reported their OWN failure — the ones worth triaging.
          genuine="$(jq -r '
            to_entries
            | map(select(
                .value.result != "success"
                and .value.result != "skipped"
                and .value.result != "cancelled"))
            | map("\(.key)(\(.value.result))")
            | join(" ")
          ' <<<"${NEEDS_JSON}")"

          # Jobs stopped by someone else — collateral of a fail-fast cancel.
          collateral="$(jq -r '
            to_entries
            | map(select(.value.result == "cancelled"))
            | map("\(.key)(\(.value.result))")
            | join(" ")
          ' <<<"${NEEDS_JSON}")"

          # At least one job actually succeeded? Required before any cancel may
          # be neutralized, so a wholly-cancelled run can never pass.
          any_success="$(jq -r '
            [ to_entries[] | select(.value.result == "success") ] | length
          ' <<<"${NEEDS_JSON}")"

          # ── Provenance classification (only when something was cancelled) ──
          run_class="unknown"
          detail=""
          if [ -n "${collateral}" ]; then
            run_json=""
            if command -v gh >/dev/null 2>&1; then
              run_json="$(gh run view "${RUN_ID}" --repo "${REPO}" \
                --json jobs,workflowDatabaseId,headBranch,createdAt 2>/dev/null || true)"
            fi

            # The distinct ceilings in force = this workflow's base budgets ∪ the
            # caller's override values. Either input being unset or unparseable
            # degrades that side to empty, which only ever costs the `timed-out`
            # label — never a misclassification, and never a pass, since every
            # class here is red.
            bases="${TIER_TIMEOUT_BASES:-}"
            if [ -z "${bases}" ] || ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"${bases}"; then
              bases='[]'
            fi
            overrides="${TIER_TIMEOUT_OVERRIDES:-}"
            if [ -z "${overrides}" ] || ! jq -e 'type == "object"' >/dev/null 2>&1 <<<"${overrides}"; then
              overrides='{}'
            fi
            ceilings="$(jq -cn --argjson b "${bases}" --argjson o "${overrides}" \
              '($b + [ $o[] ]) | map(select(type == "number" and . > 0)) | unique' \
              2>/dev/null || echo '[]')"

            if [ -n "${run_json}" ]; then
              # Per-cancelled-job detail, for the human reading the report. A
              # job GitHub killed at its ceiling reports a wall duration landing
              # ON that ceiling. GitHub never kills EARLY, so the window below
              # the ceiling is only the 5s that second-resolution timestamps can
              # round away; above it, 60s absorbs the kill delay. Keeping the
              # low side tight matters: the seconds just UNDER a ceiling are
              # where an ordinary fail-fast or superseded cancel of a
              # long-running job is most likely to land, and a false `timed-out`
              # there would be a confident wrong answer rather than a missing
              # one. A cancelled job matching no ceiling keeps its existing
              # classification.
              detail="$(jq -r --argjson ceilings "${ceilings}" '
                def matched_ceiling:
                  (try ((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601)) catch null) as $d
                  | if $d == null then null
                    else [ $ceilings[] | select(($d >= ((. * 60) - 5)) and ($d <= ((. * 60) + 60))) ] | first
                    end;
                [ .jobs[]? | select(.conclusion == "cancelled") ] as $stopped
                | ([ .jobs[]? | select(.conclusion == "failure") ] | length > 0) as $any_failed
                | $stopped
                | map(
                    ((.steps // []) | map(select(.conclusion != null and .conclusion != "skipped")) | length) as $ran
                    | matched_ceiling as $ceiling
                    | "\(.name): " + (if $any_failed then "fail-fast" elif $ceiling != null then "timed-out (hit its \($ceiling)m ceiling)" elif $ran == 0 then "never-started" else "stopped-mid-step" end))
                | join("; ")
              ' <<<"${run_json}" 2>/dev/null || true)"

              any_failed="$(jq -r '[ .jobs[]? | select(.conclusion == "failure") ] | length' <<<"${run_json}" 2>/dev/null || echo 0)"
              timed_out="$(jq -r --argjson ceilings "${ceilings}" '
                def matched_ceiling:
                  (try ((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601)) catch null) as $d
                  | if $d == null then null
                    else [ $ceilings[] | select(($d >= ((. * 60) - 5)) and ($d <= ((. * 60) + 60))) ] | first
                    end;
                [ .jobs[]? | select(.conclusion == "cancelled") | select(matched_ceiling != null) ] | length
              ' <<<"${run_json}" 2>/dev/null || echo 0)"
              never_started="$(jq -r '
                [ .jobs[]?
                  | select(.conclusion == "cancelled")
                  | select(((.steps // []) | map(select(.conclusion != null and .conclusion != "skipped")) | length) == 0) ]
                | length
              ' <<<"${run_json}" 2>/dev/null || echo 0)"

              if [ "${any_failed:-0}" -gt 0 ]; then
                run_class="fail-fast"
              elif [ "${timed_out:-0}" -gt 0 ]; then
                run_class="timed-out"
              elif [ "${never_started:-0}" -gt 0 ]; then
                run_class="never-started"
              else
                # Superseded only when a NEWER run exists for the same workflow
                # and branch. Anything less certain stays `unknown` — and
                # `unknown` never neutralizes anything.
                wf="$(jq -r '.workflowDatabaseId // empty' <<<"${run_json}" 2>/dev/null || true)"
                branch="$(jq -r '.headBranch // empty' <<<"${run_json}" 2>/dev/null || true)"
                started="$(jq -r '.createdAt // empty' <<<"${run_json}" 2>/dev/null || true)"
                if [ -n "${wf}" ] && [ -n "${branch}" ] && [ -n "${started}" ]; then
                  siblings="$(gh run list --repo "${REPO}" --workflow "${wf}" \
                    --branch "${branch}" --limit 30 --json databaseId,createdAt 2>/dev/null || true)"
                  if [ -n "${siblings}" ]; then
                    newer="$(jq -r --arg id "${RUN_ID}" --arg at "${started}" '
                      [ .[]? | select((.databaseId | tostring) != $id) | select(.createdAt > $at) ] | length
                    ' <<<"${siblings}" 2>/dev/null || echo 0)"
                    if [ "${newer:-0}" -gt 0 ]; then
                      run_class="superseded"
                    fi
                  fi
                fi
              fi
            fi

            echo "⏹️  Cancelled provenance: ${run_class} (policy: ${policy})" >&2
            if [ -n "${detail}" ]; then
              echo "⏹️  Per-job: ${detail}" >&2
            fi
          fi

          # ── Provenance-aware neutralization ───────────────────────────────
          # Only a provably-superseded run, with nothing else wrong and at
          # least one real pass, may clear a cancelled tier.
          if [ "${policy}" = "provenance-aware" ] \
            && [ "${run_class}" = "superseded" ] \
            && [ -z "${genuine}" ] \
            && [ "${any_success:-0}" -gt 0 ]; then
            {
              echo "### ⏭️ ci-required neutral (superseded run)"
              echo
              echo "Cancelled: ${collateral}"
              echo
              echo "A newer run for this workflow and branch supersedes this one,"
              echo "no job failed, and no cancelled job was an infra hang — so the"
              echo "newer run is authoritative and these cancels do not gate."
            } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "⏭️  Superseded run — cancelled tiers neutralized under 'provenance-aware': ${collateral}" >&2
            echo "✅ Aggregate neutral: a newer run is authoritative."
            exit 0
          fi

          if [ -n "${failed}" ]; then
            {
              echo "### ❌ ci-required failed"
              echo
              if [ -n "${genuine}" ]; then
                echo "**Failed on their own — triage these:** ${genuine}"
              else
                echo "**No job reported its own failure.** Every non-passing job"
                echo "was cancelled; look for the run-level fail-fast annotation"
                echo "naming the tier that tripped the cancellation."
              fi
              if [ -n "${collateral}" ]; then
                echo
                echo "**Cancelled — collateral, do not triage:** ${collateral}"
                echo
                echo "Provenance: \`${run_class}\` (policy \`${policy}\`)."
                if [ -n "${detail}" ]; then
                  echo
                  echo "Per-job: ${detail}"
                fi
                if [ "${run_class}" = "never-started" ]; then
                  echo
                  echo "A \`never-started\` cancel is an INFRA fault: the job never ran a"
                  echo "step, so it produced no test signal. It is not neutralized by any"
                  echo "policy — a gate that passes on a tier which never ran is a"
                  echo "vacuous pass."
                fi
                if [ "${run_class}" = "timed-out" ]; then
                  echo
                  echo "A \`timed-out\` cancel is a CONFIG fault, not an infra one: the tier"
                  echo "named above exceeded its own \`timeout-minutes\` ceiling and GitHub"
                  echo "killed it. Nothing hung — do NOT escalate to whoever owns the"
                  echo "runners. Raise that tier's entry in the \`tier-timeouts\` input"
                  echo "(or cut its work): on a self-hosted fleet the pre-job"
                  echo "\`Set up runner\` wait is charged against the same clock, so a"
                  echo "tier's real budget is work + queue wait. Size the entry as the"
                  echo "tier's default budget plus your pool's p90 setup time. Like"
                  echo "\`never-started\`, it produced no complete signal, so no policy"
                  echo "neutralizes it."
                fi
              fi
            } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

            if [ -n "${genuine}" ]; then
              echo "❌ Failed on their own (triage these): ${genuine}" >&2
            fi
            if [ -n "${collateral}" ]; then
              echo "⏹️  Cancelled — collateral, do not triage: ${collateral}" >&2
            fi
            echo "❌ Failed jobs: ${failed}" >&2
            exit 1
          fi

          # A required aggregate must never be satisfied VACUOUSLY: if EVERY
          # tier skipped (all enable toggles off), nothing actually ran, so a
          # green here would be a load-bearing pass from nothing. Fail instead,
          # forcing an all-toggles-off caller to register something real.
          # Derived from toJSON(needs) — no hardcoded tier-name list.
          all_skipped="$(jq -r '
            [ to_entries[] | .value.result ] as $r
            | ($r | length) as $n
            | if $n > 0 and ([ $r[] | select(. == "skipped") ] | length) == $n
              then "yes" else "no" end
          ' <<<"${NEEDS_JSON}")"

          if [ "${all_skipped}" = "yes" ]; then
            echo "❌ Every required tier was skipped — the aggregate cannot pass vacuously. Enable at least one tier." >&2
            exit 1
          fi

          echo "✅ All required jobs passed (success or skipped)."
